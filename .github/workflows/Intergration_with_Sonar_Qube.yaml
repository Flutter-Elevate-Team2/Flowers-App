name: Sonar-Qube
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        # تم تغيير الإصدار من v4 إلى v2 لأن v4 غير موجود حالياً
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          # تأكد من أن هذا الإصدار متوافق مع مشروعك (أو احذف السطر لاستخدام أحدث نسخة مستقرة)
          flutter-version: 3.27.0 

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        # هذه الخطوة ضرورية جداً لحساب نسبة تغطية الكود (Coverage)
        run: flutter test --coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.dart.lcov.reportPath=coverage/lcov.info
            -Dsonar.sources=lib
            -Dsonar.tests=test

      # الخطوة الإضافية للـ Quality Gate (ستجعل الـ Action يفشل إذا رسب الكود في الاختبارات)
      - name: SonarQube Quality Gate Check
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}